<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Titanium / Carbon Matte Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2f35" />
      <stop offset="50%" stop-color="#1c1e22" />
      <stop offset="100%" stop-color="#121316" />
    </linearGradient>

    <!-- Subtle Metallic Chamfer Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <!-- Chrome / Silver Gradient for Connecting Struts -->
    <linearGradient id="chromeGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="60%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- 3D Spherical Shading for Nodes -->
    <radialGradient id="nodeGrad" cx="35%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </radialGradient>

    <!-- Soft Depth Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle App-Icon Container (Ensures 100% visibility on both dark & light tabs) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="106" stroke="url(#borderGrad)" stroke-width="3" fill="none" />

  <!-- Tri-Node NetWeave Topology Mark -->
  <g filter="url(#markShadow)">
    <!-- Ambient Shadow Under the Struts -->
    <path d="M 112 254 C 210 264, 305 238, 396 74
             C 350 198, 350 312, 412 438
             C 305 344, 210 268, 112 254 Z"
          stroke="#000000" stroke-width="14" stroke-opacity="0.45" fill="none" stroke-linejoin="round" />

    <!-- Sleek Chrome Struts -->
    <path d="M 112 254 C 210 264, 305 238, 396 74
             C 350 198, 350 312, 412 438
             C 305 344, 210 268, 112 254 Z"
          stroke="url(#chromeGrad)" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Specular Highlight Core -->
    <path d="M 112 254 C 210 264, 305 238, 396 74
             C 350 198, 350 312, 412 438
             C 305 344, 210 268, 112 254 Z"
          stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Node 1: Left Anchor Vertex -->
    <circle cx="112" cy="254" r="22" fill="url(#nodeGrad)" />
    <circle cx="106" cy="248" r="6" fill="#ffffff" opacity="0.9" />

    <!-- Node 2: Top-Right Anchor Vertex -->
    <circle cx="396" cy="74" r="22" fill="url(#nodeGrad)" />
    <circle cx="390" cy="68" r="6" fill="#ffffff" opacity="0.9" />

    <!-- Node 3: Bottom-Right Anchor Vertex -->
    <circle cx="412" cy="438" r="22" fill="url(#nodeGrad)" />
    <circle cx="406" cy="432" r="6" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
